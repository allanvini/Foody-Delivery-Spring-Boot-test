spring.application.name=demo
spring.datasource.url=jdbc:sqlite:database.db?foreign_keys=on
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=2

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

application.security.jwt.issuer=food-delivery-api
application.security.jwt.access-token-ttl=PT1H
application.security.jwt.cookie-name=access_token
application.security.jwt.cookie-secure=${JWT_COOKIE_SECURE:true}
application.security.jwt.cookie-same-site=${JWT_COOKIE_SAME_SITE:Strict}

application.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
